<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with AgriMitra AI – Real-time agriculture market assistant.">
    <title>AgriMitra AI | Chat Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,500;0,600;1,500&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=16">
    <link rel="stylesheet" href="chat.css?v=7">
</head>
<body class="light-theme">
    <div class="chat-container">
        <!-- ===== SIDEBAR ===== -->
        <aside class="chat-sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="header-top-row">
                    <a href="index.html" class="logo">
                        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                            <ellipse cx="11" cy="8" rx="7" ry="9" fill="#4a6741" transform="rotate(-8 11 8)" opacity="0.9" />
                            <ellipse cx="11" cy="9" rx="4" ry="7" fill="#6a9460" transform="rotate(-8 11 9)" opacity="0.7" />
                            <line x1="11" y1="20" x2="10" y2="4" stroke="#3a5230" stroke-width="1.5" stroke-linecap="round" />
                        </svg>
                        <span>AgriMitra</span>
                    </a>
                    <div class="sidebar-actions">
                        <button class="icon-btn" title="Search chats">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                        <button class="icon-btn" id="collapse-sidebar-btn" title="Hide sidebar">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                        </button>
                    </div>
                </div>
                
                <button class="new-chat-btn" id="new-chat-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>New Chat</span>
                </button>
            </div>

            <!-- Sidebar Navigation Category links -->
            <div class="sidebar-nav-links">
                <a href="chat.html" class="nav-item active">
                    <span class="nav-icon">🌿</span>
                    <span>Consultations</span>
                </a>
                <a href="market.html" class="nav-item">
                    <span class="nav-icon">📈</span>
                    <span>Market Intel</span>
                </a>
                <a href="soil-crops.html" class="nav-item">
                    <span class="nav-icon">🍂</span>
                    <span>Soil &amp; Crops</span>
                </a>
            </div>

            <!-- Recent Sessions Section (No Pinned Chats) -->
            <div class="sidebar-section-header">Recents</div>
            <div class="sessions-list" id="sessions-list">
                <!-- Dynamically populated via JS -->
            </div>

        </aside>

        <!-- Sidebar Toggle for Mobile/Collapsed -->
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle Sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
        </button>

        <!-- ===== MAIN CHAT INTERFACE ===== -->
        <main class="chat-main">
            <!-- Header (aligned top-right items nicely in one row) -->
            <header class="chat-header">
                <div class="header-left">
                    <!-- Space for collapse toggle on mobile -->
                </div>
                <div class="header-right">
                    <a href="index.html" class="home-nav-link">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                        <span>Portal Home</span>
                    </a>

                </div>
            </header>

            <!-- Chat messages stream -->
            <div class="chat-messages" id="chat-messages">
                <!-- Welcome greeting in the center -->
                <div class="welcome-screen" id="welcome-screen">
                    <h1 class="welcome-heading">Where should we begin?</h1>

                    <!-- Tiny prompt quick-starters -->
                    <div class="prompt-quick-starters">
                        <button class="quick-prompt-btn" data-prompt="Compare tomato prices in major mandis today.">
                            📈 Compare Mandi Prices
                        </button>
                        <button class="quick-prompt-btn" data-prompt="What crop options are best for crop rotation this season?">
                            🍂 Crop Rotation Plan
                        </button>
                        <button class="quick-prompt-btn" data-prompt="Suggest natural fertilizer solutions for cotton.">
                            🌿 Organic cotton fertilization
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bottom input area with pill layout in center -->
            <footer class="chat-input-area">
                <div class="chat-input-container">
                    <form class="chat-input-form" id="chat-input-form">

                        <textarea 
                            class="chat-textarea" 
                            id="chat-textarea" 
                            placeholder="Ask anything..." 
                            rows="1" 
                            required
                        ></textarea>

                        <!-- Right buttons -->
                        <div class="input-actions-right">
                            <!-- Deep thinking toggle -->
                            <button type="button" class="think-toggle-btn" id="think-toggle-btn" title="Toggle a more detailed answer">
                                <svg class="think-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1 0-4.12 2.5 2.5 0 0 1 0-4.88 2.5 2.5 0 0 1 0-4.12A2.5 2.5 0 0 1 9.5 2z"></path>
                                    <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 0-4.12 2.5 2.5 0 0 0 0-4.88 2.5 2.5 0 0 0 0-4.12A2.5 2.5 0 0 0 14.5 2z"></path>
                                </svg>
                                <span>Think</span>
                            </button>
                            

                            
                            <!-- Send button -->
                            <button type="submit" class="send-btn" id="send-btn" aria-label="Send query">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </button>
                        </div>
                    </form>
                </div>
                <div class="input-disclaimer">
                    AgriMitra can make mistakes. Verify agricultural advice before making important decisions.
                </div>
            </footer>
        </main>
    </div>

    <script src="localization.js?v=3"></script>
    <script src="chat.js?v=2"></script>
</body>
</html>
